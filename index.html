
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima Agora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>🌤️ Clima Agora</h1>
    <p>Consulte o clima da sua cidade</p>
</header>

<main>
    <section class="busca">
        <input
                type="text"
                id="campo-cidade"
                placeholder="Digite o nome da cidade"
                aria-label="Nome da cidade"
        >
        <button id="botao-buscar" type="button">Buscar</button>
    </section>

    <section id="resultado" aria-live="polite">
        <p>Digite uma cidade para consultar o clima.</p>
    </section>

    <section class="favoritos">
        <h2>⭐ Cidades favoritas</h2>
        <div id="lista-favoritos" aria-live="polite">
            <p>Carregando favoritos...</p>
        </div>
    </section>
</main>

<footer>
    <p>Projeto Bootcamp II - Etapa 02</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
